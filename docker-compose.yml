version: '3.9'



services:
  # Redis - In-memory data store
  redis:
    image: redis:7-alpine
    container_name: audio-redis
    ports:
      - "6377:6379"
    networks:
      - audio-network
    command: redis-server
    volumes:
      - redis-data:/data
    env_file:
      - .env

  # MySQL Database
  db:
    image: mysql:8.0
    restart: always
    cap_add:
      - SYS_NICE
    environment:
      - MYSQL_DATABASE=live_audio_db
      - MYSQL_ROOT_PASSWORD=mauFJcuf5dhRMQrjj
    ports:
      - '3308:3306'
    volumes:
      - db-volume:/var/lib/mysql
    networks:
      - audio-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot", "-pmauFJcuf5dhRMQrjj"]
      interval: 10s
      timeout: 5s
      retries: 5
  nats:
    image: nats:2.10-alpine
    container_name: audio-nats
    ports:
      - "4222:4222" # Client port
      - "8222:8222" # HTTP Management/Monitoring port
    networks:
      - audio-network
    # -js enables JetStream, -sd sets the storage directory
    command: ["-js", "-sd", "/data"]
    volumes:
      - nats-data:/data
    restart: always

  # Backend - NestJS API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - DATABASE_URL=${DATABASE_URL}
    container_name: audio-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    depends_on:
      - redis
      - db
      - nats
    networks:
      - audio-network
    volumes:
      - audio-volume:/app/audio-recordings
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    restart: always
  # Frontend - React App (Dev Server)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_AUDIO_SERVER_URL=${REACT_APP_AUDIO_SERVER_URL}
        - REACT_APP_AUDIO_TRANSCRIBER_URL=${REACT_APP_AUDIO_TRANSCRIBER_URL}
    container_name: audio-frontend
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - audio-network

  # Nginx - Serve Frontend
  nginx:
    image: nginx:alpine
    container_name: audio-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - audio-network

  # Audio Transcription Service - Python Flask
  # audio-transcriber:
  #   build:
  #     context: ./audio-transcription
  #     dockerfile: Dockerfile
  #   container_name: audio-transcriber
  #   ports:
  #     - "5555:5555"
  #   env_file:
  #     - .env
  #   depends_on:
  #     - redis
  #   networks:
  #     - audio-network
  #   volumes:
  #     - audio-volume:/app/recordings

  # NATS JetStream - Messaging & Persistence
 
  live-transcription:
    build:
      context: ./live-transcription # Path to your consumer folder
      dockerfile: Dockerfile
    container_name: live-transcription
    depends_on:
      - nats
    env_file:
      - .env
    environment:
      - NATS_URL=nats://nats:4222
      - NODE_ENV=production
    networks:
      - audio-network
    restart: always

networks:
  audio-network:
    driver: bridge

volumes:
  db-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/db

  frontend-build:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/frontend

  audio-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/audio

  redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/redis

  nats-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data/nats