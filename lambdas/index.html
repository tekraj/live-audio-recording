<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <h1 class="mb-4">Student Management System</h1>
                <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#createModal">
                    Create Student
                </button>
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentTableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Create/Update Modal -->
    <div class="modal fade" id="createModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Create Student</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="studentForm">
                        <input type="hidden" id="studentId">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" id="studentName" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" id="studentEmail" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="studentPhone" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="saveBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // API URLs (Replace with actual Lambda URLs)
        const API = {
            CREATE: 'https://jsonplaceholder.typicode.com/users',
            READ: 'https://jsonplaceholder.typicode.com/users',
            UPDATE: 'https://jsonplaceholder.typicode.com/users',
            DELETE: 'https://jsonplaceholder.typicode.com/users'
        };

        let isEditMode = false;
        let modal = new bootstrap.Modal(document.getElementById('createModal'));

        // Load students on page load
        $(document).ready(function() {
            loadStudents();

            $('#saveBtn').click(function() {
                saveStudent();
            });

            document.getElementById('createModal').addEventListener('show.bs.modal', function(e) {
                if (!isEditMode) {
                    resetForm();
                    $('#modalTitle').text('Create Student');
                }
            });
        });

        function loadStudents() {
            $.ajax({
                url: API.READ,
                type: 'GET',
                success: function(data) {
                    populateTable(data.slice(0, 5)); // Limit to 5 for demo
                },
                error: function() {
                    alert('Error loading students');
                }
            });
        }

        function populateTable(students) {
            const tbody = $('#studentTableBody');
            tbody.empty();
            students.forEach(student => {
                const row = `<tr>
                    <td>${student.id}</td>
                    <td>${student.name}</td>
                    <td>${student.email}</td>
                    <td>${student.phone || 'N/A'}</td>
                    <td>
                        <button class="btn btn-sm btn-warning editBtn" onclick="editStudent(${student.id})">Edit</button>
                        <button class="btn btn-sm btn-danger" onclick="deleteStudent(${student.id})">Delete</button>
                    </td>
                </tr>`;
                tbody.append(row);
            });
        }

        function saveStudent() {
            const id = $('#studentId').val();
            const name = $('#studentName').val();
            const email = $('#studentEmail').val();
            const phone = $('#studentPhone').val();

            if (!name || !email || !phone) {
                alert('Please fill all fields');
                return;
            }

            const method = isEditMode ? 'PUT' : 'POST';
            const url = isEditMode ? API.UPDATE + '/' + id : API.CREATE;

            $.ajax({
                url: url,
                type: method,
                contentType: 'application/json',
                data: JSON.stringify({ name, email, phone }),
                success: function() {
                    modal.hide();
                    loadStudents();
                },
                error: function() {
                    alert('Error saving student');
                }
            });
        }

        function editStudent(id) {
            $.ajax({
                url: API.READ + '/' + id,
                type: 'GET',
                success: function(student) {
                    isEditMode = true;
                    $('#studentId').val(student.id);
                    $('#studentName').val(student.name);
                    $('#studentEmail').val(student.email);
                    $('#studentPhone').val(student.phone || '');
                    $('#modalTitle').text('Update Student');
                    modal.show();
                }
            });
        }

        function deleteStudent(id) {
            if (confirm('Are you sure you want to delete this student?')) {
                $.ajax({
                    url: API.DELETE + '/' + id,
                    type: 'DELETE',
                    success: function() {
                        loadStudents();
                    },
                    error: function() {
                        alert('Error deleting student');
                    }
                });
            }
        }

        function resetForm() {
            $('#studentForm')[0].reset();
            $('#studentId').val('');
        }
    </script>
</body>
</html>
